name: Unity license request

# Manual only. Creates a Unity manual-activation request (.alf) on a GitHub
# runner so the resulting license is bound to that runner. Download the
# .alf artifact, activate it on Unity's manual activation page, and paste the
# returned .ulf into the UNITY_LICENSE secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    name: Create activation request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          lfs: false

      - name: Create manual activation file
        run: |
          mkdir -p activation
          docker run --rm \
            -v "$PWD:/project" \
            -v "$PWD/activation:/out" \
            -w /project \
            unityci/editor:ubuntu-6000.3.21f1-linux-il2cpp-3 \
            /bin/bash -c '/opt/unity/Editor/Unity -batchmode -nographics -quit -createManualActivationFile -logFile /dev/stdout; cp /project/*.alf /out/ 2>/dev/null || cp /*.alf /out/ 2>/dev/null; ls -la /out'
          ls -la activation
          test -n "$(ls activation/*.alf 2>/dev/null)"

      - name: Upload activation request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-activation-request
          path: activation/*.alf
          if-no-files-found: error
          retention-days: 7
